# A deployable stack.
#
# This is not the development compose file with different passwords. The differences are the
# point:
#
#   - No published ports except the reverse proxy. Postgres, Redis, Keycloak and both
#     applications are reachable only on the internal network. A database exposed to the internet
#     is found by a scanner within hours, and "it has a strong password" is not a plan.
#   - Secrets come from a .env file that is never committed, and every one of them is required.
#     There is not a single default in this file, deliberately.
#   - Two database roles. dip_owner owns the schema and runs migrations; dip_app runs the
#     application and is subject to row-level security. The backend refuses to start if these
#     are the same account — see ProductionSafety.
#   - Images are pulled by digest-bearing tag from the registry, not built here. A server that
#     builds its own images is a server that can drift from what CI tested.
#
# Usage is documented in docs/DEPLOYMENT.md. Read it before running this.

name: dip

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?set POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}
      # Deterministic collation, so an index built on one host behaves identically on another.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"

      # Read by postgres-init/10-keycloak-database.sh, and absent until the first real deployment
      # went looking for them. The script requires all three and the container was given none, so
      # on a fresh data directory it exited at its first line.
      #
      # That failure is silent, which is the part worth remembering. A failed init script aborts
      # the entrypoint — but initdb has already populated PGDATA by then, so the automatic restart
      # finds a non-empty data directory, skips initialisation entirely, and comes up healthy with
      # no Keycloak role in it. The symptom surfaces minutes later and two containers away, as
      # "password authentication failed for user keycloak", which is Postgres being discreet about
      # a role that does not exist.
      KEYCLOAK_DB: ${KEYCLOAK_DB:?set KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory only. Keycloak needs its own database and the
      # image creates just POSTGRES_DB.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Sessions live here. Without a password anything that reaches the network can read every
    # session token in the system.
    # The password is read from the environment inside the container rather than interpolated
    # by compose, so it appears once in this file instead of twice. Anyone who can run
    # `docker inspect` on the host sees it either way — that is a host access problem, not one
    # this file can solve.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # `start`, not `start-dev`. The development mode disables HTTPS requirements and caching and
    # is not something to discover in production.
    #
    # NOT `--optimized`, and that flag cost an afternoon. It means "a build has already been run,
    # use the persisted build-time configuration and skip the build step" — which is right only
    # for an image you built yourself with `kc.sh build`. This is the stock image, where kc.db is
    # still the default and kc.health-enabled is off, so --optimized made Keycloak ignore
    # KC_DB=postgres and KC_HEALTH_ENABLED, say so in a warning, and then exit in three seconds,
    # over and over. The warning names the two options it is discarding and does not say it is
    # fatal, so the log reads as noise rather than as the cause.
    #
    # Without it, `start` runs the build itself on each boot: about fifteen seconds added to a
    # start-up that already takes forty, in exchange for a configuration that is actually applied.
    command: ["start", "--http-port=8081", "--proxy-headers=xforwarded"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:?set KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      # The full URL, not the bare name. Keycloak refuses to start with "hostname must be set to a
      # URL when hostname-admin is set", and the two settings arrived in separate commits, so the
      # rejection landed on a container that had been starting fine a moment earlier.
      #
      # Built here rather than stored in deploy.env, because KEYCLOAK_HOSTNAME is also what the
      # Caddyfile matches on, and a site block cannot be addressed by a URL.
      KC_HOSTNAME: https://${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME}

      # The admin console lives at localhost, reachable only through an SSH tunnel.
      #
      # Without this the console is unreachable by any route. KC_HOSTNAME makes Keycloak build
      # absolute URLs at the public name, so a request arriving as localhost:8081/admin is
      # answered with a redirect to https://id.dival.ai/admin — which the proxy deliberately 404s.
      # Blocked in front, redirected from behind: the runbook told you to open a console that this
      # configuration could not serve, and the symptom is a 404 that looks like the tunnel failing.
      #
      # Pointing hostname-admin at localhost keeps the console off the public name — the property
      # exists for exactly this — while making the tunnel the way in rather than a way in.
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    # Bound to the loopback address of the host and nowhere else, so the admin console is reachable
    # over `ssh -L 8081:localhost:8081` and by nothing on the network.
    #
    # This reverses an earlier decision, and the reversal is the point. The argument against was
    # that "a port that exists is a port somebody eventually binds to 0.0.0.0 in a hurry", so the
    # documented route was to forward to the container's address on the Docker bridge instead.
    # That address changes every time the container is recreated, which is several times an hour
    # during a first deployment, and each stale copy fails as a connection refused that looks like
    # Keycloak being down. It cost five attempts to reach a login page.
    #
    # The `127.0.0.1:` prefix is explicit, greppable, and does not publish anything: the firewall
    # and the security group both refuse 8081 regardless. Weigh the hypothetical edit against the
    # certainty that the correct procedure is unusable, and this is the safer of the two.
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:?set GITHUB_REPOSITORY}/backend:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    environment:
      # prod always, and demo alongside it on the shared testing instance. Never demo instead
      # of prod: the demo profile carries no datasource, no issuer and no connection settings —
      # it says only what is in the database at start-up. See application-demo.yml.
      #
      # The one variable in this file with a default, against the rule the rest of it follows.
      # That rule exists so a missing value stops the deployment rather than quietly falling back
      # to something from development, and here the fallback IS the restrictive answer: an
      # unset variable cannot cause demonstration data to appear on a host that holds real
      # records. Demo has to be asked for, in writing, in deploy.env.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      DIP_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      # The owner. Runs migrations, and nothing else.
      DIP_DB_USER: ${POSTGRES_OWNER_USER}
      DIP_DB_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      # The application role. Subject to row-level security; this is the boundary between one
      # telecom's debt records and another's.
      #
      # Not configurable, and it would be dishonest to make it look as though it were: V1 creates
      # the role by this exact name and V4 gives it a password. Changing it means changing the
      # migrations.
      DIP_APP_DB_USER: dip_app
      DIP_APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      DIP_OIDC_ISSUER_URI: ${OIDC_ISSUER:?set OIDC_ISSUER}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:?set SITE_URL}
      # Server-to-server over the internal network. The browser never uses this address, and the
      # backend is not reachable from outside at all.
      API_BASE_URL: http://backend:8080
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      # Confidential client. The frontend refuses to start in production without this.
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
    depends_on:
      - backend
      - redis
    networks: [internal]

  # The only service with a published port. Terminates TLS, obtains and renews certificates, and
  # is the single place the outside world touches.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOSTNAME: ${SITE_HOSTNAME:?set SITE_HOSTNAME}
      KEYCLOAK_HOSTNAME: ${KEYCLOAK_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - keycloak
    networks: [internal]

  # Takes an encrypted dump on a schedule. Built and published by CI like everything else, so the
  # thing guarding your data is not a script somebody edited on the server.
  backup:
    image: ghcr.io/${GITHUB_REPOSITORY}/backup:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      # The owner, because pg_dumpall reads every database and the role definitions. dip_app can
      # see almost nothing by design, which is the whole point of it.
      PGUSER: ${POSTGRES_OWNER_USER}
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD}

      BACKUP_DIR: /backups
      BACKUP_CRON: ${BACKUP_CRON:?set BACKUP_CRON}
      BACKUP_KEEP: ${BACKUP_KEEP:?set BACKUP_KEEP}

      # The PUBLIC half of an age key pair. The private half must not be on this machine — that is
      # what makes a stolen host not also a stolen copy of every salary in the system.
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY:-}
      BACKUP_ENCRYPTION_DISABLED: ${BACKUP_ENCRYPTION_DISABLED:-false}
      BACKUP_OFFSITE_CONFIRMED: ${BACKUP_OFFSITE_CONFIRMED:-false}
    volumes:
      # A bind mount rather than a named volume, so it can point at attached storage or at a
      # directory something else syncs off the host. A named volume would live on the same disk as
      # the database, which protects against the database breaking and nothing else.
      - ${BACKUP_HOST_DIR:?set BACKUP_HOST_DIR}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
