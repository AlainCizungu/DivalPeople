name: dip

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dip}
      POSTGRES_USER: ${POSTGRES_USER:-dip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dip}
    ports:
      # Deliberately a high, unusual port. Local PostgreSQL installs take 5432, and tools like
      # Postgres.app run each version on the next port up (5433, 5434...). Worse, on macOS a
      # local instance may listen on IPv6 ::1 while Docker binds IPv4 0.0.0.0, so both start
      # happily and connections land on whichever the client resolves first — surfacing as an
      # authentication error rather than an obvious port clash.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dip} -d ${POSTGRES_DB:-dip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # High port for the same reason: a locally installed Redis very commonly owns 6379.
      - "${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Identity provider for local development. Not a production configuration:
  # dev mode disables TLS and uses an in-memory database.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--http-port=8081", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8081}:8081"
    volumes:
      # Imported on first start only. To re-import after editing, recreate the container:
      #   docker compose -f infra/docker-compose.yml up -d --force-recreate keycloak
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
  redis-data:
