# Local development profile. Activated automatically by `./gradlew bootRun`.
#
# Assumes `docker compose -f infra/docker-compose.yml up -d` is running.

spring:
  # 127.0.0.1 rather than localhost, deliberately: localhost may resolve to ::1 first and
  # reach a locally installed PostgreSQL instead of the container.
  datasource:
    url: jdbc:postgresql://127.0.0.1:${POSTGRES_HOST_PORT:55432}/dip
    username: dip_app
    password: dip_app

  # Owner credentials, used only to run migrations.
  flyway:
    url: jdbc:postgresql://127.0.0.1:${POSTGRES_HOST_PORT:55432}/dip
    user: dip
    password: dip
    placeholders:
      dip_app_password: dip_app

  jpa:
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: 127.0.0.1
      # Matches REDIS_HOST_PORT in infra/docker-compose.yml, which avoids 6379 because a
      # locally installed Redis usually has it.
      port: ${REDIS_HOST_PORT:56379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/dip

dip:
  tix:
    # A CDF floor, for local demonstration only, and deliberately absent from application.yml.
    #
    # Production refuses a currency whose reporting threshold nobody has decided, because setting
    # one means choosing a USD/CDF rate that moves and that somebody accountable has to own. That
    # stays true. The figure below exists so the local dataset can hold two currencies and show
    # that the exposure view never adds them together — which is a property no single-currency
    # book can demonstrate.
    #
    # It is a fixture. If it ever appears in a deployed configuration, somebody has copied the
    # wrong file.
    minimum-declarable:
      USD: 100
      CDF: 250000

  cors:
    # Empty since ADR 0003. The browser talks only to the Next.js application, which calls this
    # API server-to-server, so no cross-origin request should reach here at all. Leaving an
    # allowed origin configured would keep a door open that nothing walks through any more.
    allowed-origins: []

  local:
    # Seeds two telecom tenants whose IDs match the tenant_id attributes of the
    # operator-a and operator-b users in infra/keycloak/realm-dip.json.
    seed-tenants: true

    # Seeds a small organisation tree per tenant so the structure screen has something to show.
    seed-organization: true

    # Seeds a small team, including a contract ending inside the notice window so the expiry
    # scan has something real to find.
    seed-employees: true

    # Seeds an open requisition with candidates spread across the pipeline stages, so the
    # recruitment board shows more than one column.
    seed-recruitment: true

    # Seeds onboarding and offboarding templates plus one live list anchored in the past, so the
    # overdue reminder scan has something real to find.
    seed-lifecycle: true

    # Seeds leave types, the DRC holiday calendar, entitlements and two requests - one still
    # awaiting a decision, so the approval queue is not empty.
    seed-leave: true

    # Seeds two weeks of attendance, deliberately imperfect - one late evening, one
    # correction, and a part-timer whose week is expected to be shorter.
    seed-attendance: true

    # Seeds a review cycle with reviews at different stages, including one shared and
    # disagreed with - the case people most want to see working before trusting the module.
    seed-performance: true

    # Seeds courses and training records that produce a real compliance gap: one current
    # ticket, one lapsed, one never sat.
    seed-learning: true

    # Seeds salaries with a raise in history, pay components and one calculated but
    # unapproved run. The percentages are INVENTED placeholders, not statutory rates.
    seed-payroll: true

    # Links the fixture Keycloak sign-ins to seeded employees, so the self-service portal has
    # somebody to be on first load. Depends on the fixed user ids in the realm file.
    seed-self-service: true

    # Seeds one demo subject with a debt held by operator B, so an inquiry from operator A
    # actually crosses the tenant boundary and exercises exchange mode — plus, from
    # LocalTixPortfolioSeeder, two books of businesses spread across every aging band.
    seed-tix: true

logging:
  level:
    ai.dival.dip: DEBUG
    # Was DEBUG. An import of the real 4,290-row export writes one log line per insert, which
    # costs more than the inserts do and buries everything else in the console — including the
    # timing line the batching was added to be judged by. Raise it back when debugging a query;
    # the ai.dival.dip logger above still carries what the application is doing.
    org.hibernate.SQL: INFO
    org.springframework.security: DEBUG
