spring:
  servlet:
    multipart:
      # Spring's default is 1 MB, which is smaller than every limit the application enforces for
      # itself: FileProperties allows 20 MB and ingest allows 10. Left unset, a 2 MB upload is
      # rejected by the container before any module's own check runs, and the caller gets a 500
      # for an ordinary client mistake. This is set above both so each module's limit — with its
      # own readable message — is the one that decides.
      max-file-size: ${DIP_MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${DIP_MAX_REQUEST_SIZE:25MB}
  application:
    name: dip-backend

  # The application connects as the unprivileged dip_app role, which does NOT own the schema and
  # therefore cannot bypass row-level security. Migrations run as the owner, configured below.
  datasource:
    url: ${DIP_DB_URL:jdbc:postgresql://localhost:5432/dip}
    username: ${DIP_APP_DB_USER:dip_app}
    password: ${DIP_APP_DB_PASSWORD:dip_app}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Hibernate never alters it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Migrations run as the schema owner, not as the application role.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    url: ${DIP_DB_URL:jdbc:postgresql://localhost:5432/dip}
    user: ${DIP_DB_USER:dip}
    password: ${DIP_DB_PASSWORD:dip}
    placeholders:
      dip_app_password: ${DIP_APP_DB_PASSWORD:dip_app}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DIP_OIDC_ISSUER_URI:http://localhost:8081/realms/dip}

dip:
  tix:
    # Inquiries one operator may make in an hour. The exchange holds competitors' debt records,
    # and every request is individually legitimate — the aggregate is what turns a lookup service
    # into a bulk export. This does not make a sweep impossible, it makes it slow enough that the
    # audit trail has time to be read.
    inquiries-per-hour: ${DIP_TIX_INQUIRIES_PER_HOUR:120}

    # The reporting threshold from the March 2026 terms of reference: obligations below this do
    # not enter the registry at all. It is the only control here that keeps people out rather
    # than limiting what happens to those already in, and a shared bad-payer list with no floor
    # makes somebody unbankable over a rounding error.
    #
    # Per currency, and a currency absent from this map is REFUSED rather than defaulted. CDF is
    # deliberately not listed. Setting it means choosing a USD/CDF rate, that rate moves, and
    # somebody accountable has to own it and revisit it — an invented constant here would be a
    # stale exchange rate dressed up as policy. Add CDF when a person has decided the number.
    minimum-declarable:
      USD: 100

    # How long somebody stays in the registry. These are LEGAL periods, not engineering constants,
    # and the values below are the TDR's illustrative figures — they have NOT been checked against
    # the Code du numérique. See docs/TIX_RETENTION.md before treating them as settled.
    retention:
      simple-years: ${DIP_TIX_RETENTION_SIMPLE_YEARS:3}
      repeat-years: ${DIP_TIX_RETENTION_REPEAT_YEARS:5}
      # Days a regularised debt survives after settlement. The TDR asks for erasure on
      # regularisation; a short window lets the settling operator reconcile, and settlement can
      # only ever bring erasure forward, never push it away. Zero means erase at the next sweep.
      settled-days: ${DIP_TIX_RETENTION_SETTLED_DAYS:30}

    # Nightly, away from the HR sweeps so a slow purge cannot delay the morning alerts.
    retention-purge-cron: ${DIP_TIX_RETENTION_PURGE_CRON:0 15 2 * * *}

  hr:
    # How much warning to give before a contract ends.
    contract-expiry-notice-days: ${DIP_CONTRACT_EXPIRY_NOTICE_DAYS:30}
    # Early morning, so alerts are waiting at the start of the day rather than interrupting it.
    contract-expiry-cron: ${DIP_CONTRACT_EXPIRY_CRON:0 0 6 * * *}

    # Shorter than the contract window on purpose: a probation decision has to land before the
    # period ends, because after it the answer has already been given by silence.
    probation-notice-days: ${DIP_PROBATION_NOTICE_DAYS:14}
    checklist-overdue-cron: ${DIP_CHECKLIST_OVERDUE_CRON:0 15 6 * * *}

    # The working week for anybody with no pattern of their own. Employees on a part-time
    # contract carry a work_pattern, which overrides this.
    working-days: ${DIP_WORKING_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY}

    # A full working day, in minutes, scaled by each employee's pattern.
    standard-day-minutes: ${DIP_STANDARD_DAY_MINUTES:480}

    # 45 hours. Beyond this a week counts as overtime whatever the daily pattern says, which is
    # the statutory ceiling in the DRC and several neighbouring jurisdictions. Attendance states
    # the minutes; what they are worth is a payroll decision.
    weekly-overtime-threshold-minutes: ${DIP_WEEKLY_OVERTIME_THRESHOLD_MINUTES:2700}

    # Clock times are recorded as instants; this is the zone that decides which day a shift
    # belongs to. A night shift starting at 22:00 counts against the day it started.
    timezone: ${DIP_TIMEZONE:Africa/Kinshasa}

    leave-accrual-cron: ${DIP_LEAVE_ACCRUAL_CRON:0 30 5 1 * *}

    # Longer than the contract window: booking a safety refresher means finding a course
    # date and a day the person can be spared, which takes weeks rather than days.
    certification-notice-days: ${DIP_CERTIFICATION_NOTICE_DAYS:60}
    certification-expiry-cron: ${DIP_CERTIFICATION_EXPIRY_CRON:0 30 6 * * *}

  files:
    # 20 MB. Uploads are read into memory to checksum them, so this also bounds heap per request.
    max-size-bytes: ${DIP_FILES_MAX_SIZE_BYTES:20971520}
    # Allowlist, not blocklist: a blocklist is a guess about every dangerous type ever invented.
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/webp
      - text/csv
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

  cors:
    # Empty by default: an unconfigured environment refuses cross-origin requests rather than
    # accepting every origin. Set explicitly per environment.
    allowed-origins: ${DIP_CORS_ALLOWED_ORIGINS:}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    ai.dival.dip: DEBUG
