spring:
  servlet:
    multipart:
      # Spring's default is 1 MB, which is smaller than every limit the application enforces for
      # itself: FileProperties allows 20 MB and ingest allows 10. Left unset, a 2 MB upload is
      # rejected by the container before any module's own check runs, and the caller gets a 500
      # for an ordinary client mistake. This is set above both so each module's limit — with its
      # own readable message — is the one that decides.
      max-file-size: ${DIP_MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${DIP_MAX_REQUEST_SIZE:25MB}
  application:
    name: dip-backend

  # The application connects as the unprivileged dip_app role, which does NOT own the schema and
  # therefore cannot bypass row-level security. Migrations run as the owner, configured below.
  datasource:
    url: ${DIP_DB_URL:jdbc:postgresql://localhost:5432/dip}
    username: ${DIP_APP_DB_USER:dip_app}
    password: ${DIP_APP_DB_PASSWORD:dip_app}
    hikari:
      maximum-pool-size: 10
      data-source-properties:
        # Turns a JDBC batch of inserts into a single multi-row INSERT. Hibernate's batching
        # already cuts the number of round trips; this cuts what each one carries. Set here
        # rather than appended to the URL, because the URL comes from the environment and a
        # deployment overriding it must not silently lose this.
        reWriteBatchedInserts: true

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Hibernate never alters it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # An import is thousands of inserts in one transaction, and without this each one is a
          # separate round trip. The real Vodacom export is 4,290 rows: 4,290 round trips at even
          # two milliseconds is nine seconds of an operator watching a spinner, and the fix is a
          # setting rather than a rewrite.
          #
          # This works here only because every entity's @Id is a UUID generated by Hibernate.
          # An IDENTITY column would force a round trip per row to learn the generated key, and
          # Hibernate silently disables batching for such entities — the setting would still be
          # here, still look correct, and do nothing.
          batch_size: 100
        # Inserts are grouped by table before batching. Without it, a run of inserts alternating
        # between two tables produces batches of one.
        order_inserts: true
        order_updates: true
        # Every tenant-owned entity carries @Version, and batching versioned rows is off by
        # default because it makes the row-count check per statement rather than per batch.
        # Hibernate still fails the transaction on a mismatch; it just names the batch.
        batch_versioned_data: true

  # Migrations run as the schema owner, not as the application role.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    url: ${DIP_DB_URL:jdbc:postgresql://localhost:5432/dip}
    user: ${DIP_DB_USER:dip}
    password: ${DIP_DB_PASSWORD:dip}
    placeholders:
      dip_app_password: ${DIP_APP_DB_PASSWORD:dip_app}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DIP_OIDC_ISSUER_URI:http://localhost:8081/realms/dip}

dip:
  # The language model behind the Dival AI analyst.
  #
  # TWO SWITCHES, and the split is the point. `enabled` lets the model read WHAT THE USER TYPED and
  # return a structured intent; that text carries nothing from the registry, so nothing about anybody
  # in it leaves the country. `narrate` lets the model read THE ANSWER DIP COMPUTED so it can phrase
  # it — company names and the amounts this operator is owed — which is a transfer of registry data
  # to a processor outside the DRC.
  #
  # As of August 2026 counsel has NOT been asked whether there is a basis for that transfer. The
  # question is in docs/OLIVIER_ANSWERS.md. Every outbound call writes an audit row, and the screen
  # says so while narration is on.
  #
  # No key is committed. Absent one, both switches are inert: questions are read by rule and answers
  # are rendered from figures, which is less impressive and equally true.
  ai:
    enabled: ${DIP_AI_ENABLED:false}
    narrate: ${DIP_AI_NARRATE:false}
    base-url: ${DIP_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${DIP_AI_API_KEY:}
    model: ${DIP_AI_MODEL:gpt-4o-mini}
    timeout-ms: ${DIP_AI_TIMEOUT_MS:12000}

  # WHAT ONE OPERATOR MAY LEARN ABOUT ANOTHER'S BOOK.
  #
  # Both OFF, and off is what every participant was shown. The exchange answers with a count — how
  # many institutions report a subject — and never which, never how much, never since when. That
  # sentence is the reason a competitor is willing to put its receivables ledger into a shared
  # database, and it is not renegotiated by a deployment flipping a flag quietly.
  #
  # `name-institutions` prints the operators behind the count. `disclose-amounts` prints what each
  # is owed, and does nothing unless naming is also on — an itemised list of anonymous amounts is
  # the same disclosure with an extra step.
  #
  # BEFORE EITHER IS TURNED ON, two things that are not engineering decisions:
  #   1. Counsel answers. "May the amount owed be disclosed to other institutions" is already open
  #      in docs/OLIVIER_ANSWERS.md; naming the creditor beside it is strictly more than was asked.
  #   2. Participants are told, and agree. An operator that joined on "never which, never how much"
  #      and finds its ledger itemised on a competitor's screen has a reason to leave and to sue.
  #
  # Every answer that carries names writes a TIX_CONTRIBUTORS_DISCLOSED audit row, separate from
  # the inquiry's own row, so the disclosures can be counted after the fact.
  disclosure:
    name-institutions: ${DIP_DISCLOSE_INSTITUTIONS:false}
    disclose-amounts: ${DIP_DISCLOSE_AMOUNTS:false}

  tix:
    # Inquiries one operator may make in an hour. The exchange holds competitors' debt records,
    # and every request is individually legitimate — the aggregate is what turns a lookup service
    # into a bulk export. This does not make a sweep impossible, it makes it slow enough that the
    # audit trail has time to be read.
    inquiries-per-hour: ${DIP_TIX_INQUIRIES_PER_HOUR:120}

    # The reporting threshold from the March 2026 terms of reference: obligations below this do
    # not enter the registry at all. It is the only control here that keeps people out rather
    # than limiting what happens to those already in, and a shared bad-payer list with no floor
    # makes somebody unbankable over a rounding error.
    #
    # Per currency, and a currency absent from this map is REFUSED rather than defaulted. CDF is
    # deliberately not listed. Setting it means choosing a USD/CDF rate, that rate moves, and
    # somebody accountable has to own it and revisit it — an invented constant here would be a
    # stale exchange rate dressed up as policy. Add CDF when a person has decided the number.
    minimum-declarable:
      USD: 100

    # How long somebody stays in the registry. These are LEGAL periods, not engineering constants.
    #
    # Five years, on counsel's advice of August 2026, replacing the TDR's illustrative three and
    # five that nobody had checked against the Code du numérique. Both periods are now five, so a
    # repeat default is currently kept no longer than a first one — the two settings survive
    # because a deployment may yet be told to differentiate.
    retention:
      simple-years: ${DIP_TIX_RETENTION_SIMPLE_YEARS:5}
      repeat-years: ${DIP_TIX_RETENTION_REPEAT_YEARS:5}
      # NOT advised on, and still an unchecked placeholder — the one figure in this block that is.
      # Days a regularised debt survives after settlement. The TDR asks for erasure on
      # regularisation; a short window lets the settling operator reconcile, and settlement can
      # only ever bring erasure forward, never push it away. Zero means erase at the next sweep.
      settled-days: ${DIP_TIX_RETENTION_SETTLED_DAYS:30}

    # Nightly, away from the HR sweeps so a slow purge cannot delay the morning alerts.
    retention-purge-cron: ${DIP_TIX_RETENTION_PURGE_CRON:0 15 2 * * *}

    # Continuous monitoring, thirty minutes after the purge. Deliberately after: a subject whose
    # records are past their retention period is erased at 02:15, and sweeping first would raise
    # alerts about companies the registry is about to forget — telling an operator that a customer
    # improved overnight when what happened is that the evidence expired.
    monitoring-sweep-cron: ${DIP_TIX_MONITORING_SWEEP_CRON:0 45 2 * * *}

  hr:
    # How much warning to give before a contract ends.
    contract-expiry-notice-days: ${DIP_CONTRACT_EXPIRY_NOTICE_DAYS:30}
    # Early morning, so alerts are waiting at the start of the day rather than interrupting it.
    contract-expiry-cron: ${DIP_CONTRACT_EXPIRY_CRON:0 0 6 * * *}

    # Shorter than the contract window on purpose: a probation decision has to land before the
    # period ends, because after it the answer has already been given by silence.
    probation-notice-days: ${DIP_PROBATION_NOTICE_DAYS:14}
    checklist-overdue-cron: ${DIP_CHECKLIST_OVERDUE_CRON:0 15 6 * * *}

    # The working week for anybody with no pattern of their own. Employees on a part-time
    # contract carry a work_pattern, which overrides this.
    working-days: ${DIP_WORKING_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY}

    # A full working day, in minutes, scaled by each employee's pattern.
    standard-day-minutes: ${DIP_STANDARD_DAY_MINUTES:480}

    # 45 hours. Beyond this a week counts as overtime whatever the daily pattern says, which is
    # the statutory ceiling in the DRC and several neighbouring jurisdictions. Attendance states
    # the minutes; what they are worth is a payroll decision.
    weekly-overtime-threshold-minutes: ${DIP_WEEKLY_OVERTIME_THRESHOLD_MINUTES:2700}

    # Clock times are recorded as instants; this is the zone that decides which day a shift
    # belongs to. A night shift starting at 22:00 counts against the day it started.
    timezone: ${DIP_TIMEZONE:Africa/Kinshasa}

    leave-accrual-cron: ${DIP_LEAVE_ACCRUAL_CRON:0 30 5 1 * *}

    # Longer than the contract window: booking a safety refresher means finding a course
    # date and a day the person can be spared, which takes weeks rather than days.
    certification-notice-days: ${DIP_CERTIFICATION_NOTICE_DAYS:60}
    certification-expiry-cron: ${DIP_CERTIFICATION_EXPIRY_CRON:0 30 6 * * *}

  files:
    # 20 MB. Uploads are read into memory to checksum them, so this also bounds heap per request.
    max-size-bytes: ${DIP_FILES_MAX_SIZE_BYTES:20971520}
    # Allowlist, not blocklist: a blocklist is a guess about every dangerous type ever invented.
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/webp
      - text/csv
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

  cors:
    # Empty by default: an unconfigured environment refuses cross-origin requests rather than
    # accepting every origin. Set explicitly per environment.
    allowed-origins: ${DIP_CORS_ALLOWED_ORIGINS:}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    ai.dival.dip: DEBUG
