spring:
  application:
    name: dip-backend

  # The application connects as the unprivileged dip_app role, which does NOT own the schema and
  # therefore cannot bypass row-level security. Migrations run as the owner, configured below.
  datasource:
    url: ${DIP_DB_URL:jdbc:postgresql://localhost:5432/dip}
    username: ${DIP_APP_DB_USER:dip_app}
    password: ${DIP_APP_DB_PASSWORD:dip_app}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Hibernate never alters it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Migrations run as the schema owner, not as the application role.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    url: ${DIP_DB_URL:jdbc:postgresql://localhost:5432/dip}
    user: ${DIP_DB_USER:dip}
    password: ${DIP_DB_PASSWORD:dip}
    placeholders:
      dip_app_password: ${DIP_APP_DB_PASSWORD:dip_app}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DIP_OIDC_ISSUER_URI:http://localhost:8081/realms/dip}

dip:
  hr:
    # How much warning to give before a contract ends.
    contract-expiry-notice-days: ${DIP_CONTRACT_EXPIRY_NOTICE_DAYS:30}
    # Early morning, so alerts are waiting at the start of the day rather than interrupting it.
    contract-expiry-cron: ${DIP_CONTRACT_EXPIRY_CRON:0 0 6 * * *}

    # Shorter than the contract window on purpose: a probation decision has to land before the
    # period ends, because after it the answer has already been given by silence.
    probation-notice-days: ${DIP_PROBATION_NOTICE_DAYS:14}
    checklist-overdue-cron: ${DIP_CHECKLIST_OVERDUE_CRON:0 15 6 * * *}

    # The working week for anybody with no pattern of their own. Employees on a part-time
    # contract carry a work_pattern, which overrides this.
    working-days: ${DIP_WORKING_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY}

    # A full working day, in minutes, scaled by each employee's pattern.
    standard-day-minutes: ${DIP_STANDARD_DAY_MINUTES:480}

    # 45 hours. Beyond this a week counts as overtime whatever the daily pattern says, which is
    # the statutory ceiling in the DRC and several neighbouring jurisdictions. Attendance states
    # the minutes; what they are worth is a payroll decision.
    weekly-overtime-threshold-minutes: ${DIP_WEEKLY_OVERTIME_THRESHOLD_MINUTES:2700}

    # Clock times are recorded as instants; this is the zone that decides which day a shift
    # belongs to. A night shift starting at 22:00 counts against the day it started.
    timezone: ${DIP_TIMEZONE:Africa/Kinshasa}

    leave-accrual-cron: ${DIP_LEAVE_ACCRUAL_CRON:0 30 5 1 * *}

  files:
    # 20 MB. Uploads are read into memory to checksum them, so this also bounds heap per request.
    max-size-bytes: ${DIP_FILES_MAX_SIZE_BYTES:20971520}
    # Allowlist, not blocklist: a blocklist is a guess about every dangerous type ever invented.
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/webp
      - text/csv
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

  cors:
    # Empty by default: an unconfigured environment refuses cross-origin requests rather than
    # accepting every origin. Set explicitly per environment.
    allowed-origins: ${DIP_CORS_ALLOWED_ORIGINS:}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    ai.dival.dip: DEBUG
