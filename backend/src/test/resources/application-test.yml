spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    placeholders:
      # Local-only credential for the unprivileged application role created by V4.
      dip_app_password: dip_app
  data:
    redis:
      # Redis repositories stay off — nothing here is a Redis repository.
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      # RedisAutoConfiguration is NO LONGER excluded. It was, with a comment saying Redis was not
      # required by these tests — true until the TIX rate limiter made a StringRedisTemplate a
      # hard dependency of ExchangeService, at which point every context test failed at once.
      #
      # The template is auto-configured but never contacted: Lettuce connects lazily, and
      # TestRequestCounter supplies a @Primary in-memory counter so nothing reaches a socket.
      # Keeping the production counter unconditional is deliberate — making it conditional on
      # Redis being present would mean a deployment that lost Redis silently lost its rate limit,
      # which is the same "omission removes the control" shape as the authorization findings.
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tests authenticate with mock JWTs; no issuer is contacted.
          issuer-uri: http://localhost/unused

logging:
  level:
    org.hibernate.SQL: WARN
