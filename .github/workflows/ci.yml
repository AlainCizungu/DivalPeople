name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Integration tests use Testcontainers; the runner provides Docker.
      - name: Build and test
        working-directory: backend
        run: ./gradlew --no-daemon build

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The rules in AGENTS.md are only real if something checks them.
      - name: Check module boundaries and tenant isolation policies
        run: python3 scripts/check_architecture.py

      # The deployment host runs these under dash, and bash accepts things dash refuses. A setup
      # script that parses on a laptop and not on the server is a broken deployment discovered by
      # the person doing the deploying, which has now happened.
      - name: Check every shell script under the shell it declares
        run: |
          sudo apt-get install -y --no-install-recommends dash > /dev/null
          sh scripts/check_shell.sh

  backup:
    name: Backup script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The failure paths are the ones that matter and the ones nobody exercises by hand. These
      # stub pg_dumpall, so they need no database and run in about ten seconds.
      - name: Prove the backup script fails when the dump fails
        run: sh infra/backup/backup.test.sh

  translations:
    name: Translation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A key present in one language and missing in the other is a bug, not a warning.
      - name: Compare message keys
        run: |
          python3 - <<'PY'
          import json, sys

          def keys(obj, prefix=""):
              out = set()
              for key, value in obj.items():
                  path = f"{prefix}{key}"
                  if isinstance(value, dict):
                      out |= keys(value, path + ".")
                  else:
                      out.add(path)
              return out

          with open("frontend/messages/en.json", encoding="utf-8") as handle:
              en = keys(json.load(handle))
          with open("frontend/messages/fr.json", encoding="utf-8") as handle:
              fr = keys(json.load(handle))

          missing_fr = sorted(en - fr)
          missing_en = sorted(fr - en)

          if missing_fr or missing_en:
              for key in missing_fr:
                  print(f"missing in fr.json: {key}")
              for key in missing_en:
                  print(f"missing in en.json: {key}")
              sys.exit(1)

          print(f"OK — {len(en)} keys present in both languages")
          PY
