name: Release

# Publishes container images, and only from a commit that passed everything.
#
# `workflow_run` rather than a `push` trigger, so this cannot start until CI has finished and
# reported success. A pipeline that builds images in parallel with the tests will eventually
# publish an image from a red build, at exactly the moment somebody is in a hurry.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual runs exist for re-publishing a tag after a registry problem. They still refuse to
  # publish anything that is not on main.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

# Action versions, and why several of them are not the newest.
#
# The runner warns that Node 20 is deprecated and that actions still requesting it will stop
# working. Actions/checkout, setup-java, setup-node and upload-artifact are all on majors that
# bundle Node 20, and the newer majors that fix it exist. They are not bumped here because a
# version bump nobody has verified, in the workflow that publishes container images, is the kind
# of change that is fine four times and catastrophic the fifth.
#
# Check what is current and move them deliberately, one at a time, watching a run:
#   gh api repos/actions/checkout/releases/latest --jq .tag_name
#   gh api repos/actions/setup-java/releases/latest --jq .tag_name
#   gh api repos/actions/setup-node/releases/latest --jq .tag_name
#   gh api repos/actions/upload-artifact/releases/latest --jq .tag_name
#
# The deadline is real but it is not today: a deprecation warning is a warning, and the job that
# was actually failing was failing for an unrelated reason — see the scan step below.

jobs:
  guard:
    name: Refuse to publish a red build
    runs-on: ubuntu-latest
    # The whole reason this workflow is separate. `workflow_run` fires on failure too.
    #
    # The branch check on the manual path is not decoration. `branches: [main]` above applies to
    # `workflow_run` and to nothing else, so until August 2026 a workflow_dispatch from any branch
    # in the repository would build that branch and push it to the registry — while the comment on
    # the trigger claimed manual runs "still refuse to publish anything that is not on main". The
    # comment described an intention and the code did not implement it. Now it does.
    #
    # A manual run still skips the did-CI-pass check, and that is deliberate: its purpose is
    # re-publishing after a registry problem, when CI passed and the push did not. It is a smaller
    # hole than the one above because main is at least a commit somebody reviewed.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Report what is being published
        run: |
          echo "Event:      ${{ github.event_name }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion || 'n/a (manual)' }}"
          echo "Ref:        ${{ github.ref }}"
          echo "Commit:     ${{ github.event.workflow_run.head_sha || github.sha }}"

  images:
    name: Build and publish ${{ matrix.component }}
    needs: guard
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # Required to upload the vulnerability report below.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
          # The backup image is published like the others rather than built on the server. The
          # thing guarding your data should not be a script somebody edited over SSH.
          - component: backup
            context: infra/backup

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the commit CI actually tested, not whatever main has moved on to. Otherwise a
          # merge landing during a release produces an image tagged with a commit it does not
          # contain.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
          labels: |
            org.opencontainers.image.title=DIP ${{ matrix.component }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Built once and loaded locally first, so the scan below examines the artefact that is
      # about to be published rather than a rebuild of it.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan for known vulnerabilities
        # Pinned to a commit, not a tag, and the reason is this action specifically.
        #
        # This step used to say `@0.28.0`. That tag no longer resolves, which is why the job
        # failed before it ran a single command. Public reporting (StepSecurity, Snyk, Socket,
        # among others) describes trivy-action being compromised in March 2026 via imposter
        # commits behind existing tags, affecting the 0.0.1–0.34.2 range, with v0.35.0 the first
        # clean release afterwards. The old tags appear to have been removed in the cleanup.
        #
        # A tag is a moving pointer somebody else controls. That is tolerable for most actions
        # and not for this one: it runs in a job holding packages:write and security-events:write
        # on a workflow whose entire purpose is publishing container images. An action that can
        # be repointed underneath us there could publish a backdoored image over a green build.
        # So: a SHA, which cannot be repointed, resolved from the v0.35.0 tag.
        #
        # v0.36.0 exists (April 2026) and is also post-incident. Moving up is fine — resolve the
        # commit yourself rather than trusting the tag:
        #   git ls-remote https://github.com/aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          # The tag the Build step actually loaded, taken from the same action that produced it.
          #
          # This used to be assembled by hand as
          #   ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}:latest
          # and it had two faults, either of which was enough to break the job.
          #
          # github.repository is "AlainCizungu/DivalPeople". Docker references must be lowercase,
          # and docker/metadata-action quietly lowercases its `images` input — so the image on the
          # runner was ghcr.io/alaincizungu/divalpeople/..., the string above was not a valid
          # reference at all, and Trivy had nothing to scan. It wrote no SARIF, and the upload step
          # below then failed with "Path does not exist", which is the error that gets reported and
          # the one that explains nothing.
          #
          # And ":latest" is conditional — metadata-action only emits it on the default branch.
          # Reading the tag back out means the scan can never drift from the build.
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          # Reported, not blocking. A base-image CVE with no fix available would otherwise stop
          # every deployment including the one carrying a security fix of our own. The report
          # goes to the security tab so it is visible rather than merely logged.
          exit-code: "0"

      - name: Publish the scan
        # always(), so a scan that fails after writing its report still publishes what it found.
        # And only when there is a file: if the scan produced nothing, the honest signal is the
        # scan step's own failure above, not an upload complaining about a missing path.
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.component)) != ''
        # v4. GitHub's runner warns that v3 is deprecated from December 2026.
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}

      - name: Say what was published
        run: |
          echo "Published:"
          echo "${{ steps.meta.outputs.tags }}"
